name: Desktop apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-audit --no-fund
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop
      - name: Open the app and walk through it
        if: runner.os != 'Linux'
        run: node smoke.cjs
        working-directory: desktop
      - name: Open the app and walk through it
        if: runner.os == 'Linux'
        run: xvfb-run -a node smoke.cjs
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: readfirst-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
